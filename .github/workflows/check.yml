name: Check plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -v
      - run: python build_release.py
      - name: Scan for secrets locally
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --no-verify --exclude-files '(^|/)(\.git|__pycache__|dist)/' --exclude-secrets '^(test-only|old-private-key|shared-key|synthetic-secret)$' > /tmp/secret-scan.json
          python - <<'PY'
          import json
          results = json.load(open('/tmp/secret-scan.json'))['results']
          if results:
              for path, findings in results.items():
                  print(path, [finding['line_number'] for finding in findings])
              raise SystemExit('Potential secrets found; review before publishing')
          print('Secret scan passed (only explicit synthetic test values are excluded).')
          PY
